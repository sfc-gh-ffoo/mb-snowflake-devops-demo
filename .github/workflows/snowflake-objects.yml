# =============================================================================
# MAYBANK SNOWFLAKE DEVOPS DEMO
# Snowflake Objects Deployment (Stored Procedures, Views, etc.)
# =============================================================================

name: "Deploy Snowflake Objects"

on:
  push:
    branches:
      - main
    paths:
      - 'snowflake/**'
  
  pull_request:
    branches:
      - main
    paths:
      - 'snowflake/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      dry_run:
        description: 'Dry run (show changes only)'
        required: true
        default: true
        type: boolean

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Validate SQL Syntax
  # ---------------------------------------------------------------------------
  validate:
    name: "Validate SQL"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install sqlfluff
        run: pip install sqlfluff sqlfluff-templater-jinja

      - name: Lint SQL files
        run: |
          sqlfluff lint snowflake/ \
            --dialect snowflake \
            --exclude-rules L016,L031 \
            || true

  # ---------------------------------------------------------------------------
  # Deploy Database Objects
  # ---------------------------------------------------------------------------
  deploy:
    name: "Deploy Objects"
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          pip install snowflake-connector-python
          pip install PyYAML

      - name: Deploy Migrations
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/deploy_objects.py

      - name: Generate Report
        run: |
          echo "## Snowflake Objects Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

